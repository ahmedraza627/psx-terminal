name: PSX Daily Pipeline

on:
  schedule:
    # 16:30 UTC = 21:30 PKT (9:30 PM PKT), Mon-Fri (official EOD & NCCPL portal settlement ke baad)
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target Session Date (YYYY-MM-DD) - Blank for auto"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: psx-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIBOR_FLOATING_DEBT_MAP: ${{ secrets.KIBOR_FLOATING_DEBT_MAP }}
          OFFMARKET_MIN_VOLUME: "10000"
          OFFMARKET_REQUIRED: "false"
          MEDIUM_TERM_STREAK_DAYS: "4"
          DIV_YIELD_MIN: "6.0"
          PE_MAX: "12.0"
          MARKET_CAP_MIN_PKR: "5000000000"
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            SESSION_DATE="${{ github.event.inputs.target_date }}"
          else
            SESSION_DATE=$(python -c "
          import datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5)))
          weekday = now.weekday()
          if weekday == 5:
              target = now - datetime.timedelta(days=1)
          elif weekday == 6:
              target = now - datetime.timedelta(days=2)
          else:
              target = now
          print(target.strftime('%Y-%m-%d'))
          ")
          fi
          echo "Target Business Session: $SESSION_DATE"
          python main.py --date "$SESSION_DATE"

      - name: Summarize signals in the job summary
        if: always()
        run: |
          {
            echo "## PSX Pipeline Run"
            echo ""
            echo "- Session: $SESSION_DATE"
            echo "- Outcome: ${{ job.status }}"
            echo ""
            echo "Check the Supabase Table Editor for \`signals_computed\`."
          } >> "$GITHUB_STEP_SUMMARY"