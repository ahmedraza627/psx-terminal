name: Daily PSX Sync Pipeline

on:
  schedule:
    # Runs Monday to Friday at 12:30 UTC (5:30 PM PKT - Market Close)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run PSX Sync Script
        run: |
          python backend/scripts/sync_market.py || echo "Scraper fallback engaged"

      - name: Commit and Push Updated Rates
        run: |
          git config --global user.name "PSX Automated Engine"
          git config --global user.email "engine@psx-terminal.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily 5:30 PM market close sync [skip ci]" && git push)